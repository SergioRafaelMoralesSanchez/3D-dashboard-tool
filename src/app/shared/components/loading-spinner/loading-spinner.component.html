@if (loading) {
  <div class="mx-3 d-flex justify-content-center align-items-center h-100">
    @if (!small) {
      <div class="divSpinner">
        <span class="spinner"></span>
      </div>
    }
    @if (small) {
      <div class="divSpinnerSmall">
        <span class="spinnerSmall"></span>
      </div>
    }
  </div>
}

<loading-spinner [loading]="loading"></loading-spinner>
<div class="container">
  <div class="cardContainer">
    @for (encargo of encargos; track encargo) {
      <div class="content" [routerLink]="['/encargos',encargo.id]">
        <app-encargo-card [encargo]="encargo"></app-encargo-card>
      </div>
    }
    @if (!loading && !encargos.length) {
      <p class="text-danger">
        No se han encontrado encargos! <br>
        Primero Añade un Cliente y un Material
      </p>
    }
  </div>
</div>
